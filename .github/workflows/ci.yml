name: CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Godot Headless Test Suite
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Scan project, generate global class cache, and import assets
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          godot --headless --editor --path . --import --quit 2>&1 | tee "$log_file"
          if grep -E "SCRIPT ERROR:|Failed to load script|Parse Error:|Compile Error:" "$log_file"; then
            echo "Godot project import reported script errors."
            exit 1
          fi

      - name: Run Core Gameplay Test Suite (116 tests)
        run: >-
          bash tools/ci/run_godot_test.sh "res://tests/test_runner.tscn" "ALL ACCEPTANCE TESTS PASSED SUCCESSFULLY!"

      - name: Run Summoning Circle Altar Test Suite (34 tests)
        run: >-
          bash tools/ci/run_godot_test.sh "res://tests/test_summoning_circle.tscn" "SUCCESS: All Summoning Circle Altar assertions passed!"

      - name: Run Phase 3 Character Animation & Combat Tests (58 tests)
        run: >-
          bash tools/ci/run_godot_test.sh "res://tests/test_character_animation_and_combat.tscn" "Phase 3 Test Results:"

      - name: Run Phase 4 Navigation & UI Tests
        run: >-
          bash tools/ci/run_godot_test.sh "res://tests/test_phase4_navigation_and_ui.tscn" "PHASE 4 TEST RESULTS:"

      - name: Run Phase 5 Combat, HUD & Skills Tests
        run: >-
          bash tools/ci/run_godot_test.sh "res://tests/test_phase5_combat_and_skills.tscn" "PHASE 5 TEST RESULTS:"

      - name: Install Android SDK components for Godot 4.3
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null
            sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313" "cmake;3.22.1"
          else
            echo "sdkmanager is not available in the Godot CI image."
            exit 1
          fi

      - name: Install Godot 4.3 Android export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-templates" "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O "$RUNNER_TEMP/godot-templates.tpz"
          unzip -q "$RUNNER_TEMP/godot-templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"

      - name: Configure Android export paths
        shell: bash
        run: |
          set -euo pipefail
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          mkdir -p "$HOME/.config/godot"
          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/javac"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          cp "$HOME/.config/godot/editor_settings-4.tres" "$HOME/.config/godot/editor_settings-4.3.tres"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Create temporary Android debug keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/dark-summoner-debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          sed -i "s|^keystore/debug=.*|keystore/debug=\"$RUNNER_TEMP/dark-summoner-debug.keystore\"|" export_presets.cfg

      - name: Export Android debug APK
        run: |
          mkdir -p export
          godot --headless --path . --export-debug "Android" export/DarkSummoner-debug.apk
          test -s export/DarkSummoner-debug.apk

      - name: Upload Android debug APK (expires after 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: dark-summoner-android-debug
          path: export/DarkSummoner-debug.apk
          if-no-files-found: error
          retention-days: 1
