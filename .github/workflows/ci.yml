name: CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Godot Headless Test Suite
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Scan project, generate global class cache, and import assets
        run: godot --headless --editor --path . --import --quit

      - name: Run Core Gameplay Test Suite (116 tests)
        run: godot -v --headless --path . "res://tests/test_runner.tscn"

      - name: Run Summoning Circle Altar Test Suite (34 tests)
        run: godot -v --headless --path . "res://tests/test_summoning_circle.tscn"

      - name: Run Phase 3 Character Animation & Combat Tests (58 tests)
        run: godot -v --headless --path . "res://tests/test_character_animation_and_combat.tscn"

      - name: Run Phase 4 Navigation & UI Tests (56 tests)
        run: godot -v --headless --path . "res://tests/test_phase4_navigation_and_ui.tscn"

      - name: Run Phase 5 Combat, HUD & Skills Tests (73 tests)
        run: godot -v --headless --path . "res://tests/test_phase5_combat_and_skills.tscn"
