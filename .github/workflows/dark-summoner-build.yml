name: Dark Summoner Build
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-build:
    name: Blender GLB + Godot Tests + Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender unzip wget openjdk-17-jdk
      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install -m 0755 "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp -a "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"
      - name: Generate the rigged Shadow Hunter GLB with Blender
        run: |
          mkdir -p assets/generated
          DARK_SUMMONER_GLB_OUT="$GITHUB_WORKSPACE/assets/generated/shadow_hunter.glb" blender --background --factory-startup --python tools/blender/generate_shadow_hunter.py
          test -s assets/generated/shadow_hunter.glb
          file assets/generated/shadow_hunter.glb
      - name: Import project and validate scripts and GLB
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          godot --headless --editor --path . --import --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E "SCRIPT ERROR:|Failed to load script|Parse Error:|Compile Error:" "$RUNNER_TEMP/import.log"; then
            echo "Godot import reported script errors."
            exit 1
          fi
          find .godot/imported -iname '*shadow_hunter*' -type f -print
      - name: Run Core Gameplay Test Suite
        run: bash tools/ci/run_godot_test.sh "res://tests/test_runner.tscn" "ALL ACCEPTANCE TESTS PASSED SUCCESSFULLY!"
      - name: Run Summoning Circle Test Suite
        run: bash tools/ci/run_godot_test.sh "res://tests/test_summoning_circle.tscn" "SUCCESS: All Summoning Circle Altar assertions passed!"
      - name: Run Phase 3 Character Animation & Combat Tests
        run: bash tools/ci/run_godot_test.sh "res://tests/test_character_animation_and_combat.tscn" "Phase 3 Test Results:"
      - name: Run Phase 4 Navigation & UI Tests
        run: bash tools/ci/run_godot_test.sh "res://tests/test_phase4_navigation_and_ui.tscn" "PHASE 4 TEST RESULTS:"
      - name: Run Phase 5 Combat, HUD & Skills Tests
        run: bash tools/ci/run_godot_test.sh "res://tests/test_phase5_combat_and_skills.tscn" "PHASE 5 TEST RESULTS:"
      - name: Create CI-only Android debug keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/dark-summoner-debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          sed -i "s|^keystore/debug=.*|keystore/debug=\"$RUNNER_TEMP/dark-summoner-debug.keystore\"|" export_presets.cfg
      - name: Export Android debug APK
        run: |
          mkdir -p export
          godot --headless --path . --export-debug "Android" export/DarkSummoner-debug.apk
          test -s export/DarkSummoner-debug.apk
      - name: Upload APK and generated GLB (expires after 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: dark-summoner-android-debug-and-glb
          path: |
            export/DarkSummoner-debug.apk
            assets/generated/shadow_hunter.glb
          if-no-files-found: error
          retention-days: 1
